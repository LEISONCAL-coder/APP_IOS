name: Build iOS App (AltStore / Sideloadly)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-app:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Extraer código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Cordova globalmente
        run: npm install -g cordova

      - name: Preparar Estructura del Proyecto Cordova
        run: |
          mkdir cordova_project
          cd cordova_project
          
          cordova create . com.gsc.ingenieria.actas "GSC_Actas"
          
          rm -rf www/*
          
          rsync -a --exclude='cordova_project' --exclude='.git' --exclude='.github' ../ ./www/
          
          cp ../config.xml ./config.xml
          cp ../logo_gsc.png ./logo_gsc.png

      - name: Agregar Plataforma iOS
        run: |
          cd cordova_project
          cordova platform add ios

      - name: Compilar iOS (Bypass de Firma para Sideload)
        run: |
          cd cordova_project/platforms/ios
          xcodebuild clean build \
            -workspace "App.xcworkspace" \
            -scheme "App" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar a .ipa (Para Sideloadly / AltStore)
        run: |
          cd cordova_project/platforms/ios
          
          # Buscamos la app generada por Xcode en la carpeta por defecto (DerivedData)
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "GSC Actas.app" -type d | head -n 1)
          
          mkdir Payload
          cp -r "$APP_DIR" Payload/
          
          # Comprimimos la carpeta Payload y le damos la extensión .ipa
          zip -qr GSC_Actas.ipa Payload/

      - name: Guardar el .ipa Descargable
        uses: actions/upload-artifact@v4
        with:
          name: GSC_Actas_iOS_Sideload
          path: cordova_project/platforms/ios/GSC_Actas.ipa
